version: '3.9'
services:
  mysql:
    container_name: some-mysql
    platform: linux/x86_64
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: prestashop
    # volumes:
    #   - mysql_data:/var/lib/mysql
    networks:
      - prestashop_network
  prestashop:
    container_name: prestashop
    platform: linux/x86_64
    image: prestashop/prestashop:latest
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - 8080:80
    environment:
      DB_SERVER: some-mysql
      DB_NAME: prestashop
      DB_USER: root
      DB_PASSWD: admin
      # PS_SSL_ENABLED: 0
      # PS_DOMAIN: localhost
      # PS_INSTALL_AUTO: 1
      # PS_DOMAIN: localhost:8080
    # volumes:
    #   - prestashop_data:/var/www/html
    networks:
      - prestashop_network
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - 80:80  # Needed for the ACME HTTP-01 challenge.
      - 443:443
      - "443:443/udp"
      - 2016:2016
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    #  - ./caddy-data:/data
    environment:
    #  DOMAIN: "https://localhost"
      EMAIL: "luca.sain@outlook.com"                 
      LOG_FILE: "/data/access.log"
      ACME_AGREE: "true"
    networks:
      - prestashop_network
networks:
    prestashop_network:
